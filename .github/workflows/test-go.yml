# Run Go tests and vet on pushes and pull requests touching Go sources.

name: test-go

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "*.sh"
      - "workflow/info.plist"
      - "workflow/run"
      - "workflow/nui.alfredui/**"
      - "scripts/*.py"
      - "native/**"
      - "VERSION"
      - ".github/workflows/test-go.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - run: go vet ./...
      - run: go test -race ./...

  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - run: sh make.sh
      - run: python3 scripts/test_nn_package.py
